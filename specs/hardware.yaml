# Газовые патроны / подъёмники. Точки крепления зависят от модели и веса
# створки, поэтому позиции помечаются requires_pattern, пока нет шаблона.
gas_struts:
  - id: blum-20n
    brand: Blum
    name: Газовый патрон 20 Н
    force_n: 20
    door_weight_max: 4.5
    body_offset_x: 95.0      # от передней кромки боковины
    body_offset_top: 60.0    # от верхней кромки боковины
    door_offset_x: 55.0      # от петлевой стороны створки
    door_offset_bottom: 70.0 # от нижней кромки створки
    hole_dia: 4.0
    hole_depth: 12.0
    template: false
    note: "Проверить по шаблону производителя под вес створки"

  - id: blum-40n
    brand: Blum
    name: Газовый патрон 40 Н
    force_n: 40
    door_weight_max: 9.0
    body_offset_x: 95.0
    body_offset_top: 60.0
    door_offset_x: 55.0
    door_offset_bottom: 70.0
    hole_dia: 4.0
    hole_depth: 12.0
    template: false
    note: "Проверить по шаблону производителя под вес створки"

