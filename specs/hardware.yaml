# Фурнитура: параметры для расчёта (данные, не правила).
#
# side_gap — зазор на сторону от внутренней стенки корпуса до наружной стенки
# ящика. Ширина короба = внутренняя ширина корпуса − 2 × side_gap.
# Значения — настройки цеха; сверять с каталогом производителя.

drawer_runners:
  - id: tandem-21
    brand: Blum
    name: Скрытые TANDEM plus BLUMOTION 560H
    type: hidden
    side_gap: 21.0
    lengths: [250, 270, 300, 350, 400, 450, 500, 550]
    box_height: 150.0
    # скрытые направляющие крепятся снизу; борта ящика выше переда/зада
    side_extra: 10.0
    note: "Крепление снизу: 2 отверстия, 37 мм от переднего края"

  - id: hidden-14
    brand: generic
    name: Скрытые направляющие, зазор 14 мм
    type: hidden
    side_gap: 14.0
    lengths: [250, 300, 350, 400, 450, 500]
    box_height: 150.0
    side_extra: 10.0
    note: "Скрытые направляющие; борта выше переда/зада на 10 мм"

  - id: hidden-10
    brand: generic
    name: Скрытые направляющие, зазор 10 мм
    type: hidden
    side_gap: 10.0
    lengths: [250, 300, 350, 400, 450, 500]
    box_height: 150.0
    side_extra: 10.0
    note: "Скрытые направляющие; борта выше переда/зада на 10 мм"

  - id: ball-13
    brand: generic
    name: Шариковые направляющие
    type: ball
    side_gap: 13.0
    lengths: [250, 300, 350, 400, 450, 500]
    box_height: 150.0
    side_extra: 0.0
    note: "Полного выдвижения"

  - id: roller-12.5
    brand: generic
    name: Роликовые направляющие
    type: roller
    side_gap: 12.5
    lengths: [250, 300, 350, 400, 450, 500]
    box_height: 150.0
    side_extra: 0.0
    note: "Бюджетный вариант, частичное выдвижение"

