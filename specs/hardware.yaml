# Фурнитура: параметры для расчёта (данные, не правила).
#
# side_gap — зазор на сторону от внутренней стенки корпуса до наружной стенки
# ящика. Ширина короба = внутренняя ширина корпуса − 2 × side_gap.
# Значения — настройки цеха; сверять с каталогом производителя.

drawer_runners:
  - id: tandem-21
    brand: Blum
    name: Скрытые TANDEM plus BLUMOTION 560H
    type: hidden
    side_gap: 21.0
    lengths: [250, 270, 300, 350, 400, 450, 500, 550]
    box_height: 150.0
    # скрытые направляющие крепятся снизу; борта ящика выше переда/зада
    side_extra: 10.0
    note: "Крепление снизу: 2 отверстия, 37 мм от переднего края"

