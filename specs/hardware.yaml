    name: Евровинт / эриксон 7×50
    kind: confirmat
    face_dia: 7.0
    face_depth: 13.0
    pilot_dia: 5.0
    pilot_depth: 34.0
    head_dia: 10.0
    per_joint: 2
    visibility: hidden
    price_key: confirmat
    note: "Зенковка под головку; пилот в торец"

  - id: minifix
    name: Минификс 15 мм
    kind: minifix
    face_dia: 15.0
    face_depth: 12.5
    pilot_dia: 5.0
    pilot_depth: 24.0
    head_dia: 15.0
    per_joint: 2
    visibility: hidden
    price_key: minifix
    note: "Эксцентрик в пласти + штифт в торец"

  - id: screw-4x30
    name: Саморез 4×30
    kind: screw
    face_dia: 4.0
    face_depth: 12.0
    pilot_dia: 3.0
    pilot_depth: 20.0
    head_dia: 8.0
    per_joint: 1
    visibility: visible
    price_key: screw
    note: "Фасады ящиков, задник, стяжки; зенковка по месту"

  - id: dowel
    name: Шкант 8×30
    kind: dowel
    face_dia: 8.0
    face_depth: 15.0
    pilot_dia: 8.0
    pilot_depth: 15.0
    head_dia: 8.0
    per_joint: 2
    visibility: hidden
    price_key: dowel
    note: "Без головки; клей при сборке"

