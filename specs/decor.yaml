# Справочник декора и предметов интерьера (единый источник).
# Используется API (/api/decor/catalog, /api/ai/tools) и веб-клиентом
# (apps/web/src/state/decorCatalog.ts генерируется tools/gen_decor_catalog.py).
# Экземпляры предметов хранятся в проекте: projects.doc.props[] (JSONB).
schema: decor/catalog@1

groups:
  - id: soft
    label: Мягкая мебель
  - id: beds
    label: Кровати
  - id: tables
    label: Столы и стулья
  - id: storage
    label: Корпусная мебель
  - id: tech
    label: Техника
  - id: bath
    label: Сантехника
  - id: decor
    label: Декор

# Порядок важен: это enum для ИИ (add_decor.type).
types:
  - sofa
  - armchair
  - bed
  - coffee-table
  - chair
  - dresser
  - fridge
  - stove
  - sink
  - tv
  - hood
  - toilet
  - bathtub
  - vanity
  - shower
  - lamp
  - plant
  - rug

