# Спецификация цеха (по умолчанию)
# Передаётся движку: python3 tools/kitchen.py --config specs/shop-default.yaml ...
# Поля соответствуют Config в tools/engine.py.

t: 16.0            # толщина ЛДСП, мм
t_back: 4.0        # толщина ДВП, мм

edge_front: 2.0    # кромка видимая, мм
edge_inner: 0.4    # кромка внутренняя (цоколь), мм

gap_side: 2.0      # зазор фасада по бокам, мм
gap_between: 3.0   # зазор между фасадами, мм
gap_top: 2.0       # зазор сверху, мм
gap_bottom: 2.0    # зазор снизу, мм

hardware: blum     # blum | hettich | gtv

sheet_w: 2750.0    # формат листа ЛДСП, мм
sheet_h: 1830.0
trim: 15.0         # обрез по периметру, мм
kerf: 4.0          # пропил, мм

shelf_setback: 20.0  # насколько полка короче глубины, мм
plinth: 80.0         # высота цоколя (служебное)

# Габариты по умолчанию (меняются в конструкторе на изделие)
corpus_h: 720.0      # высота корпуса, мм
corpus_d: 560.0      # глубина корпуса, мм
plinth_h: 100.0      # высота цоколя, мм
worktop_t: 38.0      # толщина столешницы, мм

# Схема каркаса (обсуждается в каждом проекте):
#   inset   — вкладные крыша/дно, боковины на всю высоту (самое распространённое)
#   overlay — накладные крыша/дно, боковины между ними
frame: inset
