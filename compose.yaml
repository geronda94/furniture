name: furniture

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture}
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-furniture} -d ${POSTGRES_DB:-furniture}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-furniture}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-furniture}
      PYTHONPATH: /app
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5176:80"
    depends_on:
      - api

volumes:
  pgdata:
