name: furniture

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-furniture}
      POSTGRES_USER: ${POSTGRES_USER:-furniture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5441:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-furniture} -d ${POSTGRES_DB:-furniture}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.api
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-furniture}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-furniture}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      RATE_SOLVE_PER_MIN: ${RATE_SOLVE_PER_MIN:-240}
      RATE_BATCH_PER_MIN: ${RATE_BATCH_PER_MIN:-120}
      RATE_VALIDATE_PER_MIN: ${RATE_VALIDATE_PER_MIN:-240}
      RATE_LAYOUT_PER_MIN: ${RATE_LAYOUT_PER_MIN:-300}
      RATE_NORMALIZE_PER_MIN: ${RATE_NORMALIZE_PER_MIN:-60}
      RATE_SAVE_PER_MIN: ${RATE_SAVE_PER_MIN:-180}
      PYTHONPATH: /app
    volumes:
      - .:/app
    ports:
      - "8003:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5176:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
